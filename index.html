<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F7F3EE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="小账本">
<meta name="format-detection" content="telephone=no">
<title>小账本</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="screen">

  <!-- ========== 明细 ========== -->
  <section class="view is-active" id="view-home">
    <header class="hero">
      <div class="hero-top">
        <button class="nav-arrow" id="prevMonth" aria-label="上个月">‹</button>
        <div class="month-label" id="monthLabel">2026年11月</div>
        <button class="nav-arrow" id="nextMonth" aria-label="下个月">›</button>
      </div>
      <div class="hero-label">本月支出</div>
      <div class="hero-amount"><span class="cur">¥</span><span id="heroExpense">0.00</span></div>
      <div class="hero-foot">
        <div class="hf"><span>收入</span><b id="heroIncome">0.00</b></div>
        <div class="hf"><span>结余</span><b id="heroBalance">0.00</b></div>
        <div class="hf"><span>笔数</span><b id="heroCount">0</b></div>
      </div>
    </header>

    <div id="recordList" class="record-list"></div>

    <div class="empty" id="homeEmpty" hidden>
      <div class="empty-ic">🧾</div>
      <p>这个月还没有记录</p>
      <span>点右下角的 + 记一笔</span>
    </div>
  </section>

  <!-- ========== 统计 ========== -->
  <section class="view" id="view-stats">
    <div class="page-head">
      <button class="nav-arrow" id="statPrev" aria-label="上个月">‹</button>
      <div class="page-title" id="statMonth">2026年11月</div>
      <button class="nav-arrow" id="statNext" aria-label="下个月">›</button>
    </div>

    <div class="seg-wrap">
      <div class="seg" id="statSeg">
        <button class="seg-btn on" data-type="expense">支出</button>
        <button class="seg-btn" data-type="income">收入</button>
      </div>
    </div>

    <div class="card chart-card">
      <div class="chart-wrap">
        <canvas id="donut" width="240" height="240"></canvas>
        <div class="chart-center">
          <span class="cc-label" id="donutLabel">合计</span>
          <span class="cc-value" id="donutValue">¥0.00</span>
        </div>
      </div>
    </div>

    <div class="card rank-card" id="catRank"></div>
  </section>

  <!-- ========== 我的 ========== -->
  <section class="view" id="view-me">
    <div class="page-head">
      <div class="page-title">我的</div>
    </div>

    <div class="card total-card">
      <div class="tc"><span>累计支出</span><b id="allExpense">¥0.00</b></div>
      <div class="tc"><span>累计收入</span><b id="allIncome">¥0.00</b></div>
      <div class="tc"><span>总笔数</span><b id="allCount">0</b></div>
    </div>

    <div class="group">
      <button class="row" id="btnExportCsv">
        <span>导出 CSV 表格</span><span class="chev-r">›</span>
      </button>
      <button class="row" id="btnExportJson">
        <span>备份数据（JSON）</span><span class="chev-r">›</span>
      </button>
      <label class="row">
        <span>从备份恢复</span><span class="chev-r">›</span>
        <input type="file" id="fileImport" accept="application/json,.json" hidden>
      </label>
      <button class="row" id="btnDemo">
        <span>载入示例数据</span><span class="chev-r">›</span>
      </button>
      <button class="row danger" id="btnClear">
        <span>清空所有数据</span><span class="chev-r">›</span>
      </button>
    </div>

    <p class="tip">数据只保存在这台设备的浏览器里，不会上传到任何服务器。清理浏览器数据前请先备份。</p>
  </section>

</div>

<!-- 底部导航 -->
<nav class="tabbar">
  <button class="tab on" data-view="home">
    <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
    <span>明细</span>
  </button>
  <button class="tab" data-view="stats">
    <svg viewBox="0 0 24 24"><path d="M5 19V10M12 19V5M19 19v-6"/></svg>
    <span>统计</span>
  </button>
  <button class="tab" data-view="me">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20c1.2-3.6 4-5.5 7.5-5.5s6.3 1.9 7.5 5.5"/></svg>
    <span>我的</span>
  </button>
</nav>

<button class="fab" id="fabAdd" aria-label="记一笔">+</button>

<!-- ========== 记账面板 ========== -->
<div class="sheet-mask" id="sheetMask"></div>
<div class="sheet" id="sheet">
  <div class="sheet-head">
    <button class="txt-btn" id="sheetCancel">取消</button>
    <div class="seg" id="typeSeg">
      <button class="seg-btn on" data-type="expense">支出</button>
      <button class="seg-btn" data-type="income">收入</button>
    </div>
    <button class="txt-btn primary" id="sheetSave">保存</button>
  </div>

  <div class="sheet-amount">
    <span class="cur">¥</span><span class="val" id="amountVal">0</span>
  </div>

  <div class="sheet-mid">
    <div class="cat-grid" id="catGrid"></div>
    <div class="field-row">
      <input type="text" id="noteInput" class="note-input" placeholder="添加备注…" maxlength="40" autocomplete="off">
      <input type="date" id="dateInput" class="date-input">
    </div>
  </div>

  <div class="keypad" id="keypad"></div>
</div>

<div class="toast" id="toast"></div>

<script src="js/app.js"></script>
</body>
</html>
